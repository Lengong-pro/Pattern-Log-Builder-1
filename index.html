<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ตัวสร้างข้อความแพทเทิร์น</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2A900">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="แพทเทิร์น">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1F24;
    --panel:#242A31;
    --panel-alt:#2C333B;
    --panel-raised:#323A43;
    --amber:#F2A900;
    --amber-dim:#8a6300;
    --red:#D8503B;
    --red-dim:#7a2e22;
    --text:#ECEDEE;
    --text-muted:#8B939B;
    --border:#363D45;
    --mono-bg:#14181C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Sarabun',sans-serif;
    font-size:15px;
    line-height:1.55;
    min-height:100vh;
  }
  .app{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:24px;
    border-bottom:1px solid var(--border);
    padding-bottom:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-mark{
    flex:0 0 auto;
    width:72px;
    height:72px;
    border-radius:14px;
    background:#fff;
    padding:4px;
    object-fit:contain;
    display:block;
  }
  .brand-text h1{
    font-size:26px;
    font-weight:800;
    margin:0 0 4px;
    letter-spacing:0.2px;
    line-height:1.2;
  }
  .brand-text h1 span{
    display:block;
  }
  .brand-text p{
    margin:0;
    color:var(--text-muted);
    font-size:13.5px;
  }
  .tabs{
    display:flex;
    gap:6px;
    background:var(--panel);
    padding:4px;
    border-radius:8px;
    border:1px solid var(--border);
  }
  .tab-btn{
    border:none;
    background:transparent;
    color:var(--text-muted);
    padding:9px 16px;
    border-radius:6px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .tab-btn.active{
    background:var(--amber);
    color:#241900;
  }
  .layout{
    display:grid;
    grid-template-columns:240px 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
  }
  .sidebar{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
  }
  .sidebar h2{
    font-size:12px;
    text-transform:none;
    color:var(--text-muted);
    margin:0 0 10px;
    font-weight:600;
  }
  .tpl-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:10px 10px;
    border-radius:7px;
    cursor:pointer;
    margin-bottom:4px;
    border:1px solid transparent;
    font-size:14px;
  }
  .tpl-item:hover{background:var(--panel-alt);}
  .tpl-item.selected{
    background:var(--panel-raised);
    border-color:var(--amber-dim);
  }
  .tpl-item .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--amber);
    flex-shrink:0;
  }
  .tpl-item span.name{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .add-tpl-btn{
    width:100%;
    margin-top:8px;
    padding:10px;
    border-radius:7px;
    border:1px dashed var(--border);
    background:transparent;
    color:var(--text-muted);
    font-family:inherit;
    font-size:13.5px;
    cursor:pointer;
  }
  .add-tpl-btn:hover{
    border-color:var(--amber);
    color:var(--amber);
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:22px;
  }
  .empty-state{
    color:var(--text-muted);
    text-align:center;
    padding:60px 20px;
    font-size:14px;
  }
  label.field-label{
    display:block;
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:6px;
    font-weight:600;
  }
  input[type=text], textarea, select{
    width:100%;
    background:var(--mono-bg);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:7px;
    padding:10px 12px;
    font-family:inherit;
    font-size:14.5px;
    outline:none;
  }
  input[type=text]:focus, textarea:focus, select:focus{
    border-color:var(--amber);
  }
  .combo-wrap{ position:relative; }
  .combo-list{
    position:absolute;
    top:calc(100% + 4px);
    left:0;
    right:0;
    z-index:30;
    background:var(--panel-raised);
    border:1px solid var(--border);
    border-radius:8px;
    max-height:220px;
    overflow-y:auto;
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }
  .combo-item{
    padding:9px 12px;
    font-size:14px;
    cursor:pointer;
  }
  .combo-item.active, .combo-item:hover{
    background:var(--amber-dim);
    color:#ffe8b0;
  }
  .combo-empty{
    padding:9px 12px;
    font-size:12.5px;
    color:var(--text-muted);
  }
  textarea{
    min-height:90px;
    resize:vertical;
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    line-height:1.7;
  }
  .row{margin-bottom:18px;}
  .pattern-pair{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media (max-width:700px){
    .pattern-pair{grid-template-columns:1fr;}
  }
  .pattern-block .tag{
    display:inline-block;
    font-size:11.5px;
    font-weight:700;
    padding:2px 9px;
    border-radius:4px;
    margin-bottom:8px;
  }
  .tag-open{background:var(--red-dim); color:#ffd9d0;}
  .tag-close{background:var(--amber-dim); color:#ffe8b0;}
  .tag-transpose{background:#2b4a6b; color:#bfe0ff;}
  .hint{
    font-size:12.5px;
    color:var(--text-muted);
    margin-top:6px;
  }
  .hint code{
    background:var(--mono-bg);
    padding:1px 5px;
    border-radius:4px;
    font-family:'IBM Plex Mono',monospace;
  }
  .blanks-title{
    font-size:13px;
    font-weight:600;
    color:var(--text-muted);
    margin:22px 0 10px;
    padding-top:16px;
    border-top:1px solid var(--border);
  }
  .blank-card{
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .blank-card .blank-name{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--amber);
    margin-bottom:8px;
    font-weight:600;
  }
  details.blank-card{ padding:0; }
  details.blank-card > summary{
    padding:12px 14px;
    cursor:pointer;
    list-style:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  details.blank-card > summary::-webkit-details-marker{ display:none; }
  details.blank-card > summary .blank-name{ margin-bottom:0; }
  details.blank-card > summary .count-badge{
    font-family:'Sarabun',sans-serif;
    font-weight:400;
    font-size:12px;
    color:var(--text-muted);
  }
  details.blank-card > summary .chevron{
    color:var(--text-muted);
    font-size:11px;
    flex-shrink:0;
    transition:transform .15s ease;
  }
  details.blank-card[open] > summary .chevron{ transform:rotate(90deg); }
  details.blank-card > .blank-card-body{ padding:0 14px 14px; }
  .variant-card{ padding:0; margin-bottom:12px; }
  .variant-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 14px;
    cursor:pointer;
  }
  .variant-header .vh-left{
    display:flex;
    align-items:center;
    gap:8px;
    flex:1;
    min-width:0;
  }
  .variant-header .vh-title{
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .variant-header .chevron{
    color:var(--text-muted);
    font-size:11px;
    flex-shrink:0;
    transition:transform .15s ease;
  }
  .variant-card.open .variant-header .chevron{ transform:rotate(90deg); }
  .variant-body{ padding:0 14px 14px; }
  .callout{
    background:var(--panel-alt);
    border:1px solid var(--amber-dim);
    border-radius:8px;
    padding:14px;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:8px;
  }
  .chip{
    background:var(--panel-raised);
    border:1px solid var(--border);
    border-radius:14px;
    padding:5px 10px;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .chip button{
    background:none;
    border:none;
    color:var(--text-muted);
    cursor:pointer;
    font-size:13px;
    line-height:1;
    padding:0;
  }
  .chip button:hover{color:var(--red);}
  .chip-add{
    display:flex;
    gap:6px;
  }
  .chip-add input{flex:1;}
  .chip-add button{
    background:var(--panel-raised);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:6px;
    padding:0 14px;
    font-family:inherit;
    cursor:pointer;
    font-size:13px;
  }
  .chip-add button:hover{border-color:var(--amber);}
  .btn{
    border:none;
    border-radius:7px;
    padding:10px 18px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-primary{background:var(--amber);color:#241900;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-muted);
  }
  .btn-ghost:hover{color:var(--text);border-color:var(--text-muted);}
  .btn-danger{
    background:transparent;
    border:1px solid var(--red-dim);
    color:var(--red);
  }
  .btn-danger:hover{background:rgba(216,80,59,0.12);}
  .actions-row{
    display:flex;
    gap:10px;
    justify-content:space-between;
    flex-wrap:wrap;
    margin-top:20px;
    padding-top:16px;
    border-top:1px solid var(--border);
  }
  .actions-row .group{display:flex; gap:10px; flex-wrap:wrap;}
  .fill-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
    gap:14px;
    margin-bottom:22px;
  }
  .preview-pair{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media (max-width:700px){
    .preview-pair{grid-template-columns:1fr;}
  }
  .preview-block .preview-title{
    font-size:12px;
    color:var(--text-muted);
    font-weight:600;
    margin-bottom:8px;
    letter-spacing:0.2px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .preview-box{
    background:var(--mono-bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    line-height:1.8;
    white-space:pre-wrap;
    word-break:break-word;
    color:var(--text);
    min-height:70px;
  }
  .log-section{
    margin-top:28px;
  }
  .log-section h3{
    font-size:14px;
    font-weight:700;
    margin:0 0 12px;
  }
  .log-entry{
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-left:3px solid var(--amber);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .log-entry .meta{
    font-size:11.5px;
    color:var(--text-muted);
    margin-bottom:8px;
    display:flex;
    gap:8px;
    align-items:center;
    justify-content:space-between;
  }
  .log-entry .meta .left{display:flex; gap:8px;}
  .log-entry .block{margin-bottom:8px;}
  .log-entry .block .lbl{
    font-size:11px;
    font-weight:700;
    color:var(--text-muted);
    margin-bottom:4px;
  }
  .log-entry .text{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .icon-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-muted);
    border-radius:6px;
    padding:5px 9px;
    font-size:12px;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  .icon-btn:hover{color:var(--amber);border-color:var(--amber-dim);}
  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--panel-raised);
    border:1px solid var(--amber-dim);
    color:var(--text);
    padding:10px 18px;
    border-radius:8px;
    font-size:13.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .name-input-row{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:18px;
  }
  .name-input-row input{
    font-size:16px;
    font-weight:600;
    font-family:'Sarabun',sans-serif;
  }
</style>
</head>

const REPEAT_START = '@เริ่มรายการ';
const REPEAT_END = '@จบรายการ';

function findRepeatBlock(pattern){
  const p = pattern || '';
  const startIdx = p.indexOf(REPEAT_START);
  const endIdx = p.indexOf(REPEAT_END);
  if(startIdx === -1 || endIdx === -1 || endIdx < startIdx) return null;
  const before = p.slice(0, startIdx);
  let blockStart = startIdx + REPEAT_START.length;
  if(p[blockStart] === '\n') blockStart++;
  else if(p[blockStart] === '\r' && p[blockStart+1] === '\n') blockStart += 2;
  let blockContent = p.slice(blockStart, endIdx);
  blockContent = blockContent.replace(/\r?\n$/, '');
  let afterStart = endIdx + REPEAT_END.length;
  if(p[afterStart] === '\n') afterStart++;
  else if(p[afterStart] === '\r' && p[afterStart+1] === '\n') afterStart += 2;
  const after = p.slice(afterStart);
  return { before, blockContent, after };
}

const $ = (sel, root=document) => root.querySelector(sel);

function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

const STORAGE_PREFIX = 'pattern-log-builder:';

// ---- shared storage (optional) ----
// Put your Firebase Realtime Database URL here (see README) to make templates + part names shared by everyone
// who opens the site. Leave it empty and the app behaves exactly as before: data stays in each person's browser.
// e.g. 'https://my-project-default-rtdb.asia-southeast1.firebasedatabase.app/pattern-log'
const SHARED_DB_URL = '';
const SHARED_KEYS = ['templates-data', 'starters-seeded-v1']; // the personal log history stays on each device
const sharedOn = () => !!SHARED_DB_URL;
const isShared = (key) => sharedOn() && SHARED_KEYS.includes(key);

async function localGet(key){
  if(window.storage && typeof window.storage.get === 'function'){
    try{
      return await window.storage.get(key, false);
    }catch(e){
      // fall through to localStorage
    }
  }
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw !== null ? { value: raw } : null;
  }catch(e){
    return null;
  }
}

async function localSet(key, value){
  if(window.storage && typeof window.storage.set === 'function'){
    try{
      const result = await window.storage.set(key, value, false);
      if(result) return result;
    }catch(e){
      // fall through to localStorage
    }
  }
  try{
    localStorage.setItem(STORAGE_PREFIX + key, value);
    return { value };
  }catch(e){
    return null;
  }
}

async function storageGet(key){
  if(!isShared(key)) return localGet(key);
  try{
    const res = await fetch(`${SHARED_DB_URL}/${key}.json`, { cache: 'no-store' });
    if(!res.ok) throw new Error('http ' + res.status);
    const remote = await res.json();
    if(remote !== null && remote !== undefined){
      await localSet(key, remote); // keep an offline copy
      return { value: remote };
    }
    // nothing on the server yet: the first person to open the site seeds it from what's already in their browser
    const local = await localGet(key);
    if(local && local.value) await fetch(`${SHARED_DB_URL}/${key}.json`, { method: 'PUT', body: JSON.stringify(local.value) }).catch(()=>{});
    return local;
  }catch(e){
    showToast('เชื่อมต่อข้อมูลกลางไม่ได้ — ใช้ข้อมูลที่เก็บไว้ในเครื่องก่อน');
    return localGet(key);
  }
}

async function storageSet(key, value){
  const local = await localSet(key, value);
  if(!isShared(key)) return local;
  try{
    const res = await fetch(`${SHARED_DB_URL}/${key}.json`, { method: 'PUT', body: JSON.stringify(value) });
    if(!res.ok) throw new Error('http ' + res.status);
    return { value };
  }catch(e){
    return null; // callers show "บันทึกไม่สำเร็จ"
  }
}

const SOURCE_OPTIONS_FIELD = 'แหล่งอะไหล่';
const SOURCE_OPTIONS_LIST = ['AOT AMF (B1)','AOT Repair (B2)','LET จาก Store SAT-1 West (B3)','AOT (042)','AOT CC5 โครงการ 5%','ถอดย้ายอะไหล่'];

function standardizeSourceOptions(tpl){
  // make sure the standard list is always present, WITHOUT throwing away any extra
  // sources someone has since added by typing a new one in — merge, never overwrite
  const apply = (arr) => {
    if(!Array.isArray(arr)) return;
    arr.forEach(b => {
      if(!b || b.name !== SOURCE_OPTIONS_FIELD) return;
      const merged = SOURCE_OPTIONS_LIST.slice();
      (b.options || []).forEach(o => { if(!merged.includes(o)) merged.push(o); });
      b.options = merged;
    });
  };
  apply(tpl.blanks);
  apply(tpl.itemBlanks);
  if(Array.isArray(tpl.variants)){
    tpl.variants.forEach(v => { apply(v.blanks); apply(v.itemBlanks); });
  }
  return tpl;
}

const TRANSPOSE_TRIGGER_VALUE = 'ถอดย้ายอะไหล่';
const TRANSPOSE_LOCATION_FIELD = 'ตำแหน่งถอดย้าย';
const DEFAULT_TRANSPOSE_PATTERN = 'ขออนุญาตแจ้งประสานงานถอดย้ายอะไหล่ [ชื่ออะไหล่] เนื่องจากที่ตำแหน่ง [ตำแหน่งไลน์] ชำรุดไม่สามารถใช้งานได้ ไม่มีอะไหล่ที่ห้องสโตร์ SAT-W ที่ W/H CC5 และโถ่งลิฟท์ AOT จึงขอถอดย้าย [ชื่ออะไหล่] จากตำแหน่ง [ตำแหน่งถอดย้าย]';

function isTransposeSource(v){ return v === TRANSPOSE_TRIGGER_VALUE; }

// templates that use "แหล่งอะไหล่" automatically get a matching "ตำแหน่งถอดย้าย" field
// (shown only when someone actually picks ถอดย้ายอะไหล่) and a default Transpose message —
// this also covers any new template a person builds later that reuses the same field name.
function templateUsesSourceField(tpl){
  return (tpl.blanks||[]).some(b => b.name === SOURCE_OPTIONS_FIELD) || (tpl.itemBlanks||[]).some(b => b.name === SOURCE_OPTIONS_FIELD);
}

function standardizeTransposeField(tpl){
  const ensureLocationField = (arr) => {
    if(!Array.isArray(arr)) return;
    const hasSource = arr.some(b => b && b.name === SOURCE_OPTIONS_FIELD);
    const hasTarget = arr.some(b => b && b.name === TRANSPOSE_LOCATION_FIELD);
    if(hasSource && !hasTarget) arr.push({name: TRANSPOSE_LOCATION_FIELD, options: []});
  };
  ensureLocationField(tpl.blanks);
  ensureLocationField(tpl.itemBlanks);
  if(Array.isArray(tpl.variants)){
    tpl.variants.forEach(v => { ensureLocationField(v.blanks); ensureLocationField(v.itemBlanks); });
  }
  if(typeof tpl.patternTranspose !== 'string') tpl.patternTranspose = '';
  if(templateUsesSourceField(tpl) && !tpl.patternTranspose.trim()){
    tpl.patternTranspose = DEFAULT_TRANSPOSE_PATTERN;
  }
  return tpl;
}

function migrate(tpl){
  if(tpl.patternOpen === undefined){
    tpl.patternOpen = tpl.pattern || '';
    tpl.patternClose = tpl.patternClose || '';
    delete tpl.pattern;
  }
  if(tpl.patternClose === undefined) tpl.patternClose = '';
  if(!Array.isArray(tpl.itemBlanks)) tpl.itemBlanks = [];
  if(!Array.isArray(tpl.variants)) tpl.variants = [];
  tpl.variants.forEach(v => {
    if(!Array.isArray(v.itemBlanks)) v.itemBlanks = [];
    if(typeof v.keyword !== 'string') v.keyword = '';
    if(typeof v.lineOpen !== 'string') v.lineOpen = '';
    if(typeof v.lineClose !== 'string') v.lineClose = '';
  });
  tpl.hasRepeat = !!findRepeatBlock(tpl.patternOpen) || !!findRepeatBlock(tpl.patternClose);
  standardizeSourceOptions(tpl);
  standardizeTransposeField(tpl);
  return tpl;
}

    lineClose: '-เปลี่ยน [ชื่ออะไหล่],L = [ความยาว] mm ([ประเภท])(ฝั่ง [ฝั่ง] : [จำนวน] EA) อะไหล่ของ [แหล่งอะไหล่]',

function matchVariant(tpl, partName){
  if(!partName) return null;
  const lower = partName.toLowerCase();
  return (tpl.variants || []).find(v => v.keyword && lower.includes(v.keyword.toLowerCase())) || null;
}

// blanks to show per item, given the current part name (excludes ชื่ออะไหล่ itself — that's always rendered as the item's trigger field)
// sourceVal is that item's current "แหล่งอะไหล่" answer — the "ตำแหน่งถอดย้าย" field only shows up once ถอดย้ายอะไหล่ is picked
function getActiveItemBlanks(tpl, partName, sourceVal){
  const variant = matchVariant(tpl, partName);
  const source = variant ? variant.itemBlanks : tpl.itemBlanks;
  return source.filter(b => {
    if(b.name === 'ชื่ออะไหล่') return false;
    if(b.name === TRANSPOSE_LOCATION_FIELD) return isTransposeSource(sourceVal);
    return true;
  });
}

// same idea for the template-level (non-repeated) blanks grid
function getActiveTopBlanks(tpl, values){
  return (tpl.blanks||[]).filter(b => {
    if(b.name === TRANSPOSE_LOCATION_FIELD) return isTransposeSource(values[SOURCE_OPTIONS_FIELD]);
    return true;
  });
}

function syncVariantItemBlanks(variant){
  const names = [
    ...extractBlankNames(variant.lineOpen || ''),
    ...extractBlankNames(variant.lineClose || '')
  ].filter((n, i, arr) => arr.indexOf(n) === i);
  const existing = {};
  (variant.itemBlanks || []).forEach(b => existing[b.name] = b.options);
  variant.itemBlanks = names.map(n => ({name:n, options: existing[n] || []}));
}

// one-click way to add the "multiple parts + special patterns" capability to any existing template,
// so it isn't limited to ones that already happen to have the markers typed in
function enableRepeatForTemplate(tpl){
  const skeleton = REPEAT_START + '\n-เปลี่ยน [ชื่ออะไหล่] [จำนวน] EA\n' + REPEAT_END;
  if(!findRepeatBlock(tpl.patternOpen)){
    const sep = tpl.patternOpen && !tpl.patternOpen.endsWith('\n') ? '\n\n' : (tpl.patternOpen ? '\n' : '');
    tpl.patternOpen = (tpl.patternOpen || '') + sep + skeleton;
  }
  if(!findRepeatBlock(tpl.patternClose)){
    const sep = tpl.patternClose && !tpl.patternClose.endsWith('\n') ? '\n\n' : (tpl.patternClose ? '\n' : '');
    tpl.patternClose = (tpl.patternClose || '') + sep + skeleton;
  }
  syncBlanks(tpl);
  tpl.hasRepeat = true;
}

async function loadAll(){
  try{
    const t = await storageGet('templates-data');
    templates = (t ? JSON.parse(t.value) : defaultTemplates()).map(migrate);
  }catch(e){
    templates = defaultTemplates();
  }
  try{
    const l = await storageGet('log-entries');
    logEntries = l ? JSON.parse(l.value) : [];
  }catch(e){
    logEntries = [];
  }

  // one-time migration for people whose saved data predates these starter templates.
  // guarded by a flag so it only ever runs once — otherwise deleting "ถอดย้ายอะไหล่",
  // "เปลี่ยนอะไหล่หลายชิ้น", or its Toothed variant would just silently come back on next load
  const seeded = await storageGet('starters-seeded-v1');
  if(!seeded){
    let changed = false;
    if(!templates.find(t => t.id === 'starter-relocate')){
      templates.push(relocateTemplate());
      changed = true;
    }
    if(!templates.find(t => t.id === 'starter-multi-parts')){
      templates.push(multiPartTemplate());
      changed = true;
    }
    const mp = templates.find(t => t.id === 'starter-multi-parts');
    if(mp && (!mp.variants || mp.variants.length === 0)){
      mp.variants = [toothedVariant()];
      changed = true;
    }
    if(changed) await saveTemplates();
    await storageSet('starters-seeded-v1', '1');
  }

  if(templates.length){ selectedId = templates[0].id; }
  renderAll();
}

async function saveTemplates(){
  templates.forEach(standardizeSourceOptions);
  templates.forEach(standardizeTransposeField);
  try{
    const result = await storageSet('templates-data', JSON.stringify(templates));
    if(!result) showToast('บันทึกไม่สำเร็จ ลองอีกครั้ง');
  }catch(e){ showToast('บันทึกไม่สำเร็จ ลองอีกครั้ง'); }
}
async function saveLog(){
  try{
    const result = await storageSet('log-entries', JSON.stringify(logEntries));
    if(!result) showToast('บันทึกไม่สำเร็จ ลองอีกครั้ง');
  }catch(e){ showToast('บันทึกไม่สำเร็จ ลองอีกครั้ง'); }
}

function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

function extractBlankNames(pattern){
  const re = /\[([^\[\]]+)\]/g;
  const names = [];
  let m;
  while((m = re.exec(pattern)) !== null){
    const n = m[1].trim();
    if(n && !names.includes(n)) names.push(n);
  }
  return names;
}

function syncBlanks(tpl){
  const patterns = [tpl.patternOpen || '', tpl.patternClose || ''];
  let itemNames = [];
  let normalNames = [];
  patterns.forEach(p => {
    const rb = findRepeatBlock(p);
    if(rb){
      extractBlankNames(rb.blockContent).forEach(n => { if(!itemNames.includes(n)) itemNames.push(n); });
      extractBlankNames(rb.before + '\n' + rb.after).forEach(n => { if(!normalNames.includes(n)) normalNames.push(n); });
    }else{
      extractBlankNames(p).forEach(n => { if(!normalNames.includes(n)) normalNames.push(n); });
    }
  });
  normalNames = normalNames.filter(n => !itemNames.includes(n));

  const existingNormal = {};
  tpl.blanks.forEach(b => existingNormal[b.name] = b.options);
  tpl.blanks = normalNames.map(n => ({name:n, options: existingNormal[n] || []}));

  if(!Array.isArray(tpl.itemBlanks)) tpl.itemBlanks = [];
  const existingItem = {};
  tpl.itemBlanks.forEach(b => existingItem[b.name] = b.options);
  tpl.itemBlanks = itemNames.map(n => ({name:n, options: existingItem[n] || []}));

  tpl.hasRepeat = itemNames.length > 0;
}

function getSelectedTpl(){
  return templates.find(t => t.id === selectedId) || null;
}

function renderSidebar(){
  const list = $('#tplList');
  list.innerHTML = '';
  templates.forEach(tpl => {
    const div = document.createElement('div');
    div.className = 'tpl-item' + (tpl.id === selectedId ? ' selected' : '');
    div.innerHTML = `<span class="dot"></span><span class="name">${escapeHtml(tpl.name || 'ไม่มีชื่อ')}</span>`;
    div.onclick = () => { selectedId = tpl.id; renderAll(); };
    list.appendChild(div);
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderTabs(){
  $('#tabBuild').classList.toggle('active', activeTab === 'build');
  $('#tabFill').classList.toggle('active', activeTab === 'fill');
}

function renderAll(){
  renderSidebar();
  renderTabs();
  renderMain();
}

function renderMain(){
  const panel = $('#mainPanel');
  const tpl = getSelectedTpl();
  if(!tpl){

          `).join('')}
        </div>
        <div class="chip-add">

          <button data-addbtn="${idx}">เพิ่ม</button>
        </div>
      </div>
    </details>
  `;
  }).join('');

  area.querySelectorAll('details.blank-card').forEach((det, idx) => {
    const key = containerId + '::' + list[idx].name;
    det.addEventListener('toggle', () => { blankCardExpanded[key] = det.open; });
  });
  area.querySelectorAll('[data-remove]').forEach(btn => {
    btn.onclick = () => {
      const [bi, oi] = btn.dataset.remove.split(':').map(Number);
      getArray()[bi].options.splice(oi, 1);
      renderBlanksArea(containerId, getArray);

  area.querySelectorAll('[data-add]').forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        const key = containerId + '::' + list[Number(inp.dataset.add)].name;
        blankCardExpanded[key] = true;
        addOption(getArray(), Number(inp.dataset.add), inp.value);
        renderBlanksArea(containerId, getArray);

  area.querySelectorAll('[data-addbtn]').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.addbtn);
      const inp = area.querySelector(`[data-add="${idx}"]`);
      const key = containerId + '::' + list[idx].name;
      blankCardExpanded[key] = true;
      addOption(getArray(), idx, inp.value);
      renderBlanksArea(containerId, getArray);
    };
  });
}

// SheetJS is only fetched the first time someone actually imports an Excel file — not loaded up front
let xlsxLibPromise = null;
function ensureXLSXLib(){
  if(window.XLSX) return Promise.resolve();
  if(!xlsxLibPromise){
    xlsxLibPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = () => resolve();
      s.onerror = () => { xlsxLibPromise = null; reject(new Error('โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ (ต้องต่ออินเทอร์เน็ตตอนนำเข้าไฟล์ .xlsx)')); };
      document.head.appendChild(s);
    });
  }
  return xlsxLibPromise;
}

async function rememberCustomValue(blanksArray, blankName, value){
  const v = (value || '').trim();
  if(!v) return;
  const blank = blanksArray.find(b => b.name === blankName);
  if(!blank) return;
  if(blank.options.length === 0) return; // free-text fields stay free-text, nothing to remember into
  if(!blank.options.includes(v)){
    blank.options.push(v);
    await saveTemplates();
  }
}

// normalized key used everywhere options are de-duplicated: trims, collapses internal
// whitespace runs, and ignores case, so "สกรู  M3", "สกรู M3", and "SKU M3" all count as
// the same existing value instead of piling up as separate near-duplicate entries
function normalizeForDedup(s){
  return (s || '').trim().replace(/\s+/g, ' ').toLowerCase();
}

function addOption(blanksArray, idx, value){
  const v = value.trim();
  if(!v) return;
  const key = normalizeForDedup(v);
  if(!blanksArray[idx].options.some(o => normalizeForDedup(o) === key)){
    blanksArray[idx].options.push(v);
  }
}

// a text input with a filter-as-you-type suggestions dropdown, backed by a field's saved options list —
// typing narrows the list (substring match), picking a suggestion fills it in, and typing something new
// is accepted as-is (same "remember it for next time" behavior as before, just without a separate mode toggle)
function createComboField({ value, options, placeholder, onInput, onCommit }){
  const wrap = document.createElement('div');
  wrap.className = 'combo-wrap';
  const inputEl = document.createElement('input');
  inputEl.type = 'text';
  inputEl.autocomplete = 'off';
  inputEl.spellcheck = false;
  inputEl.value = value || '';
  if(placeholder) inputEl.placeholder = placeholder;
  const listEl = document.createElement('div');
  listEl.className = 'combo-list';
  listEl.style.display = 'none';
  wrap.appendChild(inputEl);
  wrap.appendChild(listEl);

  let activeIdx = -1;
  let matches = [];

  function renderList(){
    const q = inputEl.value.trim().toLowerCase();
    matches = q ? options.filter(o => o.toLowerCase().includes(q)) : options.slice();
    if(matches.length === 0){
      listEl.innerHTML = `<div class="combo-empty">${q ? 'ไม่พบตัวเลือกที่ตรงกัน — จะใช้ค่าที่พิมพ์เองแทน' : 'ยังไม่มีตัวเลือกที่บันทึกไว้'}</div>`;
    }else{
      listEl.innerHTML = matches.map((o,i) => `<div class="combo-item${i===activeIdx?' active':''}" data-idx="${i}">${escapeHtml(o)}</div>`).join('');
    }
    listEl.style.display = 'block';
    listEl.querySelectorAll('.combo-item').forEach(el => {
      el.addEventListener('mousedown', (e) => {
        e.preventDefault(); // keep focus on the input so this fires before any blur handler
        selectMatch(Number(el.dataset.idx));
      });
    });
  }
  function selectMatch(idx){
    const val = matches[idx];
    if(val === undefined) return;
    inputEl.value = val;
    closeList();
    onCommit(val);
  }
  function closeList(){ listEl.style.display = 'none'; activeIdx = -1; }

  inputEl.addEventListener('focus', renderList);
  inputEl.addEventListener('input', () => {
    activeIdx = -1;
    renderList();
    onInput(inputEl.value);
  });
  inputEl.addEventListener('keydown', (e) => {
    if(listEl.style.display === 'none') return;
    if(e.key === 'ArrowDown'){ e.preventDefault(); activeIdx = Math.min(activeIdx+1, matches.length-1); renderList(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); activeIdx = Math.max(activeIdx-1, -1); renderList(); }
    else if(e.key === 'Enter'){
      if(activeIdx >= 0 && matches.length){ e.preventDefault(); selectMatch(activeIdx); }
      else { closeList(); }
    }else if(e.key === 'Escape'){ closeList(); }
  });
  inputEl.addEventListener('blur', () => {
    setTimeout(() => { closeList(); onCommit(inputEl.value); }, 120);
  });

  return wrap;
}

const TRANSPOSE_SOURCE_PHRASE = 'อะไหล่ของ [' + SOURCE_OPTIONS_FIELD + ']';
const TRANSPOSE_REPLACEMENT_PHRASE = 'อะไหล่ถอดย้ายจากตำแหน่ง [' + TRANSPOSE_LOCATION_FIELD + ']';

function buildOutput(pattern, tpl, values, items, side){
  const rb = findRepeatBlock(pattern);
  let out;
  if(rb && tpl.itemBlanks && tpl.itemBlanks.length){
    const list = (items && items.length ? items : [{}]);
    const itemLines = list.map(itemVals => {
      const partName = (itemVals && itemVals['ชื่ออะไหล่']) || '';
      const variant = matchVariant(tpl, partName);
      let lineTemplate = rb.blockContent;
      let blanksForLine = tpl.itemBlanks;
      if(variant){
        const variantLine = side === 'close' ? variant.lineClose : variant.lineOpen;
        if(variantLine){
          lineTemplate = variantLine;
          blanksForLine = variant.itemBlanks;
        }
      }
      // ถ้าเลือกแหล่งอะไหล่เป็น "ถอดย้ายอะไหล่" สำหรับชิ้นนี้ สลับข้อความฝั่ง Close ให้เป็นแบบถอดย้ายแทน
      if(side === 'close' && isTransposeSource(itemVals && itemVals[SOURCE_OPTIONS_FIELD]) && lineTemplate.includes(TRANSPOSE_SOURCE_PHRASE)){
        lineTemplate = lineTemplate.split(TRANSPOSE_SOURCE_PHRASE).join(TRANSPOSE_REPLACEMENT_PHRASE);
      }
      let line = lineTemplate;
      line = line.split('[ชื่ออะไหล่]').join(partName || '[ชื่ออะไหล่]');
      blanksForLine.forEach(b => {
        if(b.name === 'ชื่ออะไหล่') return;
        const v = (itemVals && itemVals[b.name]) || `[${b.name}]`;
        line = line.split(`[${b.name}]`).join(v);
      });
      return line;
    }).join('\n');
    out = rb.before + itemLines + (rb.after ? '\n' + rb.after : '');
  }else{
    out = pattern || '';
    if(side === 'close' && isTransposeSource(values[SOURCE_OPTIONS_FIELD]) && out.includes(TRANSPOSE_SOURCE_PHRASE)){
      out = out.split(TRANSPOSE_SOURCE_PHRASE).join(TRANSPOSE_REPLACEMENT_PHRASE);
    }
  }
  tpl.blanks.forEach(b => {
    const v = values[b.name] || `[${b.name}]`;
    out = out.split(`[${b.name}]`).join(v);
  });
  return out;
}

// text for the separate "Transpose" panel — only meaningful once someone picks ถอดย้ายอะไหล่
function buildTransposeOutput(tpl, values, items){
  const patternT = (tpl.patternTranspose || '').trim();
  if(!patternT) return '';
  const fillTop = (str) => {
    let out = str;
    (tpl.blanks||[]).forEach(b => {
      const v = values[b.name] || `[${b.name}]`;
      out = out.split(`[${b.name}]`).join(v);
    });
    return out;
  };
  // items that share the same [ตำแหน่งถอดย้าย] get combined into one message (part names joined with " + ");
  // items with a different (or blank) location each get their own separate message
  const fillGroup = (names, location) => {
    let line = tpl.patternTranspose;
    const joinedNames = names.length ? names.join(' + ') : '[ชื่ออะไหล่]';
    line = line.split('[ชื่ออะไหล่]').join(joinedNames);
    line = line.split(`[${TRANSPOSE_LOCATION_FIELD}]`).join(location || `[${TRANSPOSE_LOCATION_FIELD}]`);
    return fillTop(line);
  };
  if(tpl.hasRepeat){
    const relevant = (items||[]).filter(it => isTransposeSource(it && it[SOURCE_OPTIONS_FIELD]));
    if(relevant.length === 0) return '';
    const groups = [];
    const groupIndexByLocation = new Map();
    relevant.forEach(itemVals => {
      const loc = (itemVals[TRANSPOSE_LOCATION_FIELD] || '').trim();
      const name = itemVals['ชื่ออะไหล่'] || '[ชื่ออะไหล่]';
      if(loc && groupIndexByLocation.has(loc)){
        groups[groupIndexByLocation.get(loc)].names.push(name);
      }else{
        if(loc) groupIndexByLocation.set(loc, groups.length);
        groups.push({ location: itemVals[TRANSPOSE_LOCATION_FIELD] || '', names: [name] });
      }
    });
    return groups.map(g => fillGroup(g.names, g.location)).join('\n\n');
  }
  if(!isTransposeSource(values[SOURCE_OPTIONS_FIELD])) return '';
  return fillGroup([values['ชื่ออะไหล่'] || '[ชื่ออะไหล่]'], values[TRANSPOSE_LOCATION_FIELD]);
}

function transposeIsActive(tpl, values, items){
  return !!buildTransposeOutput(tpl, values, items);
}

function updatePreviews(tpl, values, items){
  const o = $('#previewOpen');

  if(o) o.textContent = buildOutput(tpl.patternOpen, tpl, values, items, 'open');
  if(c) c.textContent = buildOutput(tpl.patternClose, tpl, values, items, 'close');

  const transposeText = buildTransposeOutput(tpl, values, items);
  const active = !!transposeText;
  const tBlock = $('#transposeBlock');
  const tPreview = $('#previewTranspose');
  const copyTBtn = $('#copyTransposeBtn');
  const lineTBtn = $('#lineTransposeBtn');

  if(copyTBtn) copyTBtn.style.display = active ? '' : 'none';
  if(lineTBtn) lineTBtn.style.display = active ? '' : 'none';
}

function shareToLine(text){
  if(!text || !text.trim()){
    showToast('ยังไม่มีข้อความให้แชร์');
    return;
  }
  const url = 'https://line.me/R/msg/text/?' + encodeURIComponent(text);
  window.open(url, '_blank');
}

function canShare(){
  return typeof navigator.share === 'function';
}

async function shareText(text){
  if(canShare()){
    try{
      await navigator.share({ text });
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return; // user cancelled the share sheet
      copyToClipboard(text);
      return;
    }
  }
  copyToClipboard(text);
  showToast('อุปกรณ์นี้ไม่รองรับการแชร์ตรง คัดลอกให้แทน');
}

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => showToast('คัดลอกแล้ว')).catch(() => fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); showToast('คัดลอกแล้ว'); }catch(e){ showToast('คัดลอกไม่สำเร็จ'); }
  document.body.removeChild(ta);
}

function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function importFromJsonString(text){
  const data = JSON.parse(text);
  const incoming = Array.isArray(data) ? data : (data.templates || []);
  if(!Array.isArray(incoming) || incoming.length === 0){
    showToast('ไม่พบเทมเพลตในข้อมูลนี้');
    return false;
  }
  incoming.forEach(t => {
    migrate(t);
    const existingIdx = templates.findIndex(x => x.id === t.id);
    if(existingIdx >= 0){
      templates[existingIdx] = t;
    }else{
      templates.push(t);
    }
  });
  if(!Array.isArray(data) && Array.isArray(data.logEntries)){
    const existingIds = new Set(logEntries.map(l => l.id));
    data.logEntries.forEach(l => { if(!existingIds.has(l.id)) logEntries.unshift(l); });
    await saveLog();
  }
  await saveTemplates();
  selectedId = templates[0].id;
  renderAll();
  showToast('นำเข้าเทมเพลตแล้ว');
  return true;
}

// reads every cell of every sheet in the workbook (skipping each sheet's first row, treated
// as a header), and returns the distinct non-empty text values found — used to bulk-load a big
// parts catalog from Excel/CSV instead of typing names in one at a time
async function extractNamesFromWorkbookFile(file){
  await ensureXLSXLib();
  const buf = await file.arrayBuffer();
  const wb = window.XLSX.read(buf, { type: 'array' });
  const names = [];
  wb.SheetNames.forEach(sheetName => {
    const sheet = wb.Sheets[sheetName];
    const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
    rows.slice(1).forEach(row => {
      (row || []).forEach(cell => {
        const v = (cell === undefined || cell === null) ? '' : String(cell).trim();
        if(v && v.length <= 120) names.push(v);
      });
    });
  });
  const seen = new Set();
  const unique = [];
  names.forEach(n => {
    const key = normalizeForDedup(n);
    if(!seen.has(key)){ seen.add(key); unique.push(n); }
  });
  return unique;
}

// merges the imported names into every "ชื่ออะไหล่" options list this template has
// (top-level blanks, item blanks, and any variant's item blanks) without discarding what's already there.
// de-duplication is done by normalized key (trim/whitespace/case-insensitive) so re-importing the same
// file later, or a file with some names repeated from before, never piles up duplicate chips.
function mergeNamesIntoTemplate(tpl, names){
  const apply = (arr) => {
    if(!Array.isArray(arr)) return;
    arr.forEach(b => {
      if(!b || b.name !== 'ชื่ออะไหล่') return;
      const existingKeys = new Set(b.options.map(normalizeForDedup));
      names.forEach(n => {
        const key = normalizeForDedup(n);
        if(existingKeys.has(key)) return; // already present (possibly differing only in case/spacing) — skip
        b.options.push(n);
        existingKeys.add(key);
      });
    });
  };
  apply(tpl.blanks);
  apply(tpl.itemBlanks);
  (tpl.variants || []).forEach(v => { apply(v.blanks); apply(v.itemBlanks); });
}

// a quick snapshot of every normalized "ชื่ออะไหล่" value already saved anywhere, used only to tell the
// person how many names in an incoming file are actually new vs. already-known duplicates
function collectAllPartNameKeys(){
  const set = new Set();
  const scan = (arr) => {
    if(!Array.isArray(arr)) return;
    arr.forEach(b => {
      if(b && b.name === 'ชื่ออะไหล่'){
        (b.options || []).forEach(o => set.add(normalizeForDedup(o)));
      }
    });
  };
  templates.forEach(tpl => {
    scan(tpl.blanks);
    scan(tpl.itemBlanks);
    (tpl.variants || []).forEach(v => { scan(v.blanks); scan(v.itemBlanks); });
  });
  return set;
}

$('#importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  try{
    const names = await extractNamesFromWorkbookFile(file);
    if(names.length === 0){
      showToast('ไม่พบรายชื่อในไฟล์นี้');
    }else{
      const existingBefore = collectAllPartNameKeys();
      let newCount = 0, dupCount = 0;
      names.forEach(n => {
        if(existingBefore.has(normalizeForDedup(n))) dupCount++; else newCount++;
      });
      templates.forEach(tpl => mergeNamesIntoTemplate(tpl, names));
      await saveTemplates();
      renderAll();
      if(dupCount > 0 && newCount > 0){
        showToast(`นำเข้า ${names.length} รายการ — เพิ่มใหม่ ${newCount} รายการ, ข้ามรายการซ้ำ ${dupCount} รายการ`);
      }else if(dupCount > 0){
        showToast(`ทั้ง ${names.length} รายการมีอยู่แล้วในระบบ — ไม่มีการเพิ่มซ้ำ`);
      }else{
        showToast(`นำเข้าชื่ออะไหล่ใหม่ ${names.length} รายการแล้ว`);
      }
    }
  }catch(err){
    showToast('อ่านไฟล์ไม่สำเร็จ ตรวจสอบไฟล์อีกครั้ง');
  }
  e.target.value = '';
});

// text-based fallback for when native file pickers/downloads are blocked (e.g. inside app webviews)
document.querySelector('#textFallbackDetails').addEventListener('toggle', function(){
  if(this.open){
    $('#exportTextArea').value = buildExportPayloadString();
  }
});

$('#copyExportBtn').onclick = () => {
  copyToClipboard($('#exportTextArea').value);
};

$('#importFromTextBtn').onclick = async () => {
  const text = $('#importTextArea').value.trim();
  if(!text){
    showToast('ยังไม่ได้วางข้อความ');
    return;
  }
  try{
    const ok = await importFromJsonString(text);
    if(ok) $('#importTextArea').value = '';
  }catch(err){
    showToast('ข้อความไม่ถูกต้อง นำเข้าไม่สำเร็จ');
  }
};

loadAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
